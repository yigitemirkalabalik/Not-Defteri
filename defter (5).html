<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defter — Proje Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161b;
    --surface:#1c1f26;
    --surface-2:#20232c;
    --border:#2a2e39;
    --border-soft:#23262f;
    --text:#eceef1;
    --text-dim:#8d93a3;
    --text-faint:#565c6c;
    --accent:#e8a33d;
    --accent-dim:rgba(232,163,61,.14);
    --danger:#e5595e;
    --danger-dim:rgba(229,89,94,.14);
    --success:#4cb782;
    --radius:10px;
    --radius-lg:14px;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --font-body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim);color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  button{font-family:inherit;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }

  /* ---------- layout shell ---------- */
  #app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;margin-bottom:32px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand-mark{
    font-family:var(--font-mono);font-size:12px;color:var(--accent);
    border:1px solid var(--accent);border-radius:5px;padding:2px 6px;
    letter-spacing:.08em;
  }
  .brand h1{
    font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;
    letter-spacing:-.01em;
  }
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .search-input{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    font-family:var(--font-mono);font-size:13px;padding:9px 12px;border-radius:8px;
    width:200px;transition:border-color .15s;
  }
  .search-input::placeholder{color:var(--text-faint);}
  .search-input:focus{border-color:var(--accent);}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    font-size:13px;font-weight:500;padding:9px 14px;border-radius:8px;cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#1a1305;font-weight:600;}
  .btn-primary:hover{background:#f0ad4d;border-color:#f0ad4d;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2);border-color:var(--border);}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{background:var(--danger-dim);border-color:var(--danger);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:7px;border:1px solid transparent;
    background:transparent;color:var(--text-dim);cursor:pointer;transition:.15s;
  }
  .icon-btn:hover{background:var(--surface-2);border-color:var(--border);color:var(--text);}
  .icon-btn.danger:hover{color:var(--danger);background:var(--danger-dim);border-color:var(--danger);}
  .icon-btn.back-btn{width:40px;height:40px;font-size:18px;border-color:var(--border);}
  .icon-btn.back-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- project grid (home) ---------- */
  #home-view{}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:16px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid color-mix(in srgb, var(--tag-color, var(--accent)) 30%, var(--border));
    border-left:4px solid var(--tag-color, var(--accent));
    border-radius:var(--radius-lg);
    padding:16px 16px 14px;
    cursor:pointer;
    overflow:hidden;
    transition:border-color .15s, transform .12s;
    min-height:150px;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-2px);border-color:color-mix(in srgb, var(--tag-color, var(--accent)) 55%, var(--border));}
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background:var(--tag-color, var(--accent));
  }
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:4px;}
  .card-title-row{display:flex;align-items:center;gap:8px;}
  .card-dot{
    width:12px;height:12px;border-radius:50%;flex-shrink:0;
    background:var(--tag-color, var(--accent));
    box-shadow:0 0 0 3px color-mix(in srgb, var(--tag-color, var(--accent)) 22%, transparent);
  }
  .card-title{
    font-family:var(--font-display);font-weight:600;font-size:16px;
    margin:0;line-height:1.25;word-break:break-word;
  }
  .card-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s;}
  .card:hover .card-actions{opacity:1;}
  .card-actions .icon-btn{width:26px;height:26px;}
  .card-preview{
    font-size:13px;color:var(--text-dim);margin-top:10px;flex:1;
    line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-preview.empty{color:var(--text-faint);font-style:italic;}
  .card-meta{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);
    font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
  }
  .file-pill{
    display:inline-flex;align-items:center;gap:4px;
    color:var(--text-dim);
  }

  .empty-state{
    text-align:center;padding:90px 20px;color:var(--text-dim);
    border:1px dashed var(--border);border-radius:var(--radius-lg);
  }
  .empty-state h3{font-family:var(--font-display);color:var(--text);margin:14px 0 6px;font-size:18px;}
  .empty-state p{font-size:13px;color:var(--text-faint);margin:0 0 18px;}

  /* ---------- project detail view ---------- */
  #project-view{display:none;}
  #project-view.active{display:block;}
  #home-view.hidden{display:none;}

  .detail-header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:22px;flex-wrap:wrap;
  }
  .detail-header-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .detail-title-wrap{display:flex;align-items:center;gap:10px;min-width:0;}
  .tag-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;background:var(--tag-color,var(--accent));}
  .detail-title{
    font-family:var(--font-display);font-weight:700;font-size:24px;
    background:transparent;border:1px solid transparent;color:var(--text);
    border-radius:7px;padding:3px 6px;max-width:420px;
  }
  .detail-title:hover, .detail-title:focus{border-color:var(--border);background:var(--surface);}
  .save-indicator{
    font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
    opacity:0;transition:opacity .3s;
  }
  .save-indicator.show{opacity:1;color:var(--success);}

  .detail-body{
    display:grid;grid-template-columns:200px 1fr 320px;gap:20px;align-items:start;
  }
  @media (max-width:1000px){ .detail-body{grid-template-columns:170px 1fr;} .side-panel{grid-column:1/-1;} }
  @media (max-width:640px){ .detail-body{grid-template-columns:1fr;} .project-rail{position:static;order:-1;} }

  .project-rail{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:8px;display:flex;flex-direction:column;gap:2px;
    position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;
  }
  .rail-heading{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-faint);padding:6px 8px 8px;
  }
  .rail-item{
    display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:7px;
    cursor:pointer;border:1px solid transparent;transition:.12s;
  }
  .rail-item:hover{background:var(--surface-2);}
  .rail-item.active{
    background:var(--surface-2);
    border-color:color-mix(in srgb, var(--tag-color) 45%, var(--border));
  }
  .rail-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--tag-color, var(--accent));}
  .rail-name{
    font-size:12.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .rail-item.active .rail-name{color:var(--text);font-weight:600;}

  .notes-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:4px;
  }
  #note-textarea{
    width:100%;min-height:520px;resize:vertical;background:transparent;border:none;
    color:var(--text);font-family:var(--font-mono);font-size:14px;line-height:1.7;
    padding:16px;outline:none;
  }
  #note-textarea::placeholder{color:var(--text-faint);}

  .side-panel{display:flex;flex-direction:column;gap:16px;}
  .panel-box{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:14px;
  }
  .panel-heading{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-faint);margin:0 0 10px;
  }
  .dropzone{
    border:1.5px dashed var(--border);border-radius:9px;padding:22px 12px;
    text-align:center;cursor:pointer;transition:.15s;color:var(--text-dim);font-size:12.5px;
  }
  .dropzone:hover, .dropzone.dragover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .dropzone svg{display:block;margin:0 auto 8px;opacity:.7;}

  .file-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .file-item{
    display:flex;align-items:center;gap:8px;
    background:var(--surface-2);border:1px solid var(--border-soft);border-radius:7px;
    padding:8px 8px 8px 10px;cursor:pointer;transition:border-color .12s;
  }
  .file-item:hover{border-color:var(--text-faint);}
  .file-icon{flex-shrink:0;color:var(--text-faint);}
  .file-info{min-width:0;flex:1;}
  .file-name{font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
  .file-actions{display:flex;gap:2px;}
  .file-actions .icon-btn{width:24px;height:24px;}
  .no-files{font-size:12px;color:var(--text-faint);font-style:italic;text-align:center;padding:8px 0 2px;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,11,14,.6);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    width:100%;max-width:380px;padding:20px;
  }
  .modal h3{font-family:var(--font-display);margin:0 0 14px;font-size:17px;}
  .modal p{font-size:13px;color:var(--text-dim);margin:0 0 16px;line-height:1.5;}
  .modal input[type=text]{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:8px;font-size:14px;font-family:var(--font-body);margin-bottom:14px;
  }
  .modal input[type=text]:focus{border-color:var(--accent);}
  .color-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .color-swatch{
    width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;
    transition:.15s;
  }
  .color-swatch.selected{border-color:var(--text);transform:scale(1.12);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:8px;font-size:13px;z-index:80;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }

  /* ---------- file preview panel ---------- */
  .preview-overlay{
    position:fixed;inset:0;background:rgba(10,11,14,.55);
    display:none;z-index:60;
  }
  .preview-overlay.open{display:block;}
  .preview-panel{
    position:fixed;top:0;right:0;height:100vh;width:560px;max-width:96vw;min-width:340px;
    background:var(--surface);border-left:1px solid var(--border);
    display:flex;flex-direction:column;z-index:61;
    transform:translateX(100%);transition:transform .25s ease;
    box-shadow:-12px 0 30px rgba(0,0,0,.3);
  }
  .preview-panel.no-transition{transition:none;}
  .preview-overlay.open .preview-panel{transform:translateX(0);}
  .preview-resize-handle{
    position:absolute;top:0;bottom:0;left:-6px;width:12px;cursor:ew-resize;z-index:5;
    touch-action:none;
  }
  .preview-resize-handle::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:3px;height:40px;border-radius:3px;background:var(--border);transition:background .15s;
  }
  .preview-resize-handle:hover::after, .preview-resize-handle.dragging::after{background:var(--accent);}
  .preview-header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .preview-title{
    font-family:var(--font-mono);font-size:13px;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  .preview-actions{display:flex;gap:4px;flex-shrink:0;}
  .preview-body{
    flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;
  }
  .preview-body img{max-width:100%;max-height:100%;margin:auto;border-radius:8px;display:block;}
  .preview-body video{width:100%;border-radius:8px;margin:auto;}
  .preview-body audio{width:100%;margin-top:auto;margin-bottom:auto;}
  .preview-body iframe{
    width:100%;height:100%;border:none;border-radius:8px;background:#fff;min-height:60vh;
  }
  .preview-body pre{
    white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);
    font-size:12.5px;line-height:1.65;color:var(--text);margin:0;
  }
  .preview-fallback{
    margin:auto;text-align:center;color:var(--text-dim);
  }
  .preview-fallback .pf-icon{font-size:42px;margin-bottom:10px;}
  .preview-fallback p{font-size:13px;margin:0 0 16px;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">01</span>
      <h1>Defter</h1>
    </div>
    <div class="topbar-actions">
      <input type="text" class="search-input" id="search-input" placeholder="Proje ara…">
      <button class="btn btn-ghost btn-sm" id="export-btn" title="Tüm verileri yedek dosyası olarak indir">⭳ Yedekle</button>
      <button class="btn btn-ghost btn-sm" id="import-btn" title="Yedek dosyasından geri yükle">⭱ İçe aktar</button>
      <input type="file" id="import-file-input" accept="application/json" hidden>
      <button class="btn btn-primary" id="new-project-btn">+ Yeni Proje</button>
    </div>
  </header>

  <main id="home-view">
    <div class="grid" id="project-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <h3>Henüz proje yok</h3>
      <p>İlk projeni oluşturarak notlarını ve dosyalarını burada biriktirmeye başla.</p>
      <button class="btn btn-primary" id="empty-new-btn">+ Yeni Proje</button>
    </div>
  </main>

  <main id="project-view">
    <div class="detail-header">
      <div class="detail-header-left">
        <button class="icon-btn back-btn" id="back-btn" title="Ana sayfaya dön">←</button>
        <div class="detail-title-wrap">
          <span class="tag-dot" id="detail-tag-dot"></span>
          <input type="text" class="detail-title" id="detail-title" spellcheck="false">
        </div>
        <span class="save-indicator" id="save-indicator">kaydedildi</span>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="icon-btn" id="detail-color-btn" title="Renk değiştir">◐</button>
        <button class="icon-btn danger" id="detail-delete-btn" title="Projeyi sil">🗑</button>
      </div>
    </div>

    <div class="detail-body">
      <nav class="project-rail" id="project-rail">
        <div class="rail-heading">Projeler</div>
        <div id="rail-list"></div>
      </nav>

      <div class="notes-panel">
        <textarea id="note-textarea" placeholder="Bu proje için notlarını buraya yaz…"></textarea>
      </div>

      <div class="side-panel">
        <div class="panel-box">
          <p class="panel-heading">Dosyalar</p>
          <div class="dropzone" id="dropzone">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            Dosya sürükle-bırak<br>veya tıkla
          </div>
          <input type="file" id="file-input" multiple hidden>
          <ul class="file-list" id="file-list"></ul>
        </div>
      </div>
    </div>
  </main>

</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<div class="preview-overlay" id="preview-overlay">
  <div class="preview-panel" id="preview-panel">
    <div class="preview-resize-handle" id="preview-resize" title="Genişliği sürükle"></div>
    <div class="preview-header">
      <div class="preview-title" id="preview-title"></div>
      <div class="preview-actions">
        <button class="icon-btn" id="preview-toggle-src" title="Kaynağı göster" style="display:none;font-size:12px;font-family:var(--font-mono);">&lt;/&gt;</button>
        <button class="icon-btn" id="preview-maximize" title="Genişlet">⛶</button>
        <button class="icon-btn" id="preview-download" title="İndir">⭳</button>
        <button class="icon-btn" id="preview-close" title="Kapat">✕</button>
      </div>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const PALETTE = [
    {id:'amber', hex:'#e8a33d'},
    {id:'teal',  hex:'#3fb8af'},
    {id:'rose',  hex:'#e0648a'},
    {id:'violet',hex:'#9b7fe0'},
    {id:'sky',   hex:'#4fa8e0'},
    {id:'lime',  hex:'#a8c94a'},
    {id:'coral', hex:'#e6754a'},
    {id:'slate', hex:'#8b93a8'},
  ];

  /* ---------------- IndexedDB layer ---------------- */
  const DB_NAME = 'defterDB';
  const DB_VERSION = 1;
  let dbPromise = null;

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('projects')){
          db.createObjectStore('projects', {keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('files')){
          const fs = db.createObjectStore('files', {keyPath:'id'});
          fs.createIndex('projectId', 'projectId', {unique:false});
        }
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
    return dbPromise;
  }

  function tx(storeNames, mode){
    return openDB().then(db=>db.transaction(storeNames, mode));
  }

  function reqToPromise(req){
    return new Promise((resolve,reject)=>{
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }

  const DB = {
    allProjects(){
      return tx('projects','readonly').then(t=>reqToPromise(t.objectStore('projects').getAll()));
    },
    putProject(p){
      return tx('projects','readwrite').then(t=>reqToPromise(t.objectStore('projects').put(p)));
    },
    deleteProject(id){
      return tx('projects','readwrite').then(t=>reqToPromise(t.objectStore('projects').delete(id)));
    },
    filesForProject(projectId){
      return tx('files','readonly').then(t=>
        reqToPromise(t.objectStore('files').index('projectId').getAll(projectId))
      );
    },
    putFile(f){
      return tx('files','readwrite').then(t=>reqToPromise(t.objectStore('files').put(f)));
    },
    deleteFile(id){
      return tx('files','readwrite').then(t=>reqToPromise(t.objectStore('files').delete(id)));
    },
    deleteFilesForProject(projectId){
      return this.filesForProject(projectId).then(files=>
        Promise.all(files.map(f=>this.deleteFile(f.id)))
      );
    },
    allFiles(){
      return tx('files','readonly').then(t=>reqToPromise(t.objectStore('files').getAll()));
    }
  };

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
  }

  /* ---------------- state ---------------- */
  let projects = [];
  let currentProjectId = null;
  let searchTerm = '';
  let saveTimer = null;

  /* ---------------- DOM refs ---------------- */
  const homeView = document.getElementById('home-view');
  const projectView = document.getElementById('project-view');
  const grid = document.getElementById('project-grid');
  const emptyState = document.getElementById('empty-state');
  const searchInput = document.getElementById('search-input');

  const detailTitle = document.getElementById('detail-title');
  const detailTagDot = document.getElementById('detail-tag-dot');
  const saveIndicator = document.getElementById('save-indicator');
  const noteTextarea = document.getElementById('note-textarea');
  const fileListEl = document.getElementById('file-list');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');

  /* ---------------- helpers ---------------- */
  function colorHex(colorId){
    const c = PALETTE.find(c=>c.id===colorId);
    return c ? c.hex : PALETTE[0].hex;
  }

  function fmtDate(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('tr-TR', {day:'2-digit', month:'short', year:'numeric'});
  }

  function fmtSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  }

  function fileIconFor(type){
    if(type.startsWith('image/')) return '🖼';
    if(type.includes('pdf')) return '📕';
    if(type.includes('zip') || type.includes('rar')) return '🗜';
    if(type.startsWith('audio/')) return '🎵';
    if(type.startsWith('video/')) return '🎞';
    if(type.includes('text') || type.includes('json') || type.includes('csv')) return '📄';
    return '📦';
  }

  function showToast(msg){
    const root = document.getElementById('toast-root');
    root.innerHTML = '';
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    root.appendChild(t);
    setTimeout(()=>{ t.remove(); }, 2400);
  }

  /* ---------------- rendering: home ---------------- */
  function renderHome(){
    const term = searchTerm.trim().toLowerCase();
    const filtered = projects
      .filter(p => !term || p.name.toLowerCase().includes(term) || (p.note||'').toLowerCase().includes(term))
      .sort((a,b)=> b.updatedAt - a.updatedAt);

    grid.innerHTML = '';
    emptyState.style.display = (projects.length === 0) ? 'block' : 'none';
    grid.style.display = (projects.length === 0) ? 'none' : 'grid';

    if(filtered.length === 0 && projects.length > 0){
      const div = document.createElement('div');
      div.style.cssText = 'grid-column:1/-1;text-align:center;color:var(--text-faint);padding:40px 0;font-size:13px;';
      div.textContent = 'Aramanla eşleşen proje bulunamadı.';
      grid.appendChild(div);
      return;
    }

    filtered.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--tag-color', colorHex(p.color));
      card.tabIndex = 0;

      card.innerHTML = `
        <div class="card-top">
          <div class="card-title-row">
            <span class="card-dot"></span>
            <h3 class="card-title"></h3>
          </div>
          <div class="card-actions">
            <button class="icon-btn edit-btn" title="Düzenle">✎</button>
            <button class="icon-btn danger delete-btn" title="Sil">🗑</button>
          </div>
        </div>
        <p class="card-preview ${p.note ? '' : 'empty'}"></p>
        <div class="card-meta">
          <span>${fmtDate(p.updatedAt)}</span>
          <span class="file-pill" data-filecount></span>
        </div>
      `;
      card.querySelector('.card-title').textContent = p.name;
      const preview = card.querySelector('.card-preview');
      preview.textContent = p.note ? p.note : 'Not eklenmedi';

      // async file count
      DB.filesForProject(p.id).then(files=>{
        card.querySelector('[data-filecount]').textContent = files.length ? `📎 ${files.length}` : '';
      });

      card.addEventListener('click', (e)=>{
        if(e.target.closest('.card-actions')) return;
        openProject(p.id);
      });
      card.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter') openProject(p.id);
      });
      card.querySelector('.edit-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        openEditModal(p);
      });
      card.querySelector('.delete-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        openDeleteConfirm(p);
      });

      grid.appendChild(card);
    });
  }

  /* ---------------- project detail ---------------- */
  function openProject(id){
    currentProjectId = id;
    closePreview();
    const p = projects.find(x=>x.id===id);
    if(!p) return;

    homeView.classList.add('hidden');
    projectView.classList.add('active');

    detailTitle.value = p.name;
    detailTagDot.style.setProperty('--tag-color', colorHex(p.color));
    noteTextarea.value = p.note || '';
    saveIndicator.classList.remove('show');

    renderFileList(id);
    renderRail();
    noteTextarea.focus();
  }

  function renderRail(){
    const railList = document.getElementById('rail-list');
    if(!railList) return;
    railList.innerHTML = '';
    const sorted = [...projects].sort((a,b)=> b.updatedAt - a.updatedAt);
    sorted.forEach(p=>{
      const item = document.createElement('div');
      item.className = 'rail-item' + (p.id === currentProjectId ? ' active' : '');
      item.style.setProperty('--tag-color', colorHex(p.color));
      item.innerHTML = `<span class="rail-dot"></span><span class="rail-name"></span>`;
      item.querySelector('.rail-name').textContent = p.name;
      item.addEventListener('click', ()=>{
        if(p.id !== currentProjectId) openProject(p.id);
      });
      railList.appendChild(item);
    });
  }

  function closeProject(){
    currentProjectId = null;
    closePreview();
    projectView.classList.remove('active');
    homeView.classList.remove('hidden');
    renderHome();
  }

  function renderFileList(projectId){
    fileListEl.innerHTML = '';
    DB.filesForProject(projectId).then(files=>{
      files.sort((a,b)=>b.addedAt - a.addedAt);
      if(files.length === 0){
        const li = document.createElement('li');
        li.className = 'no-files';
        li.textContent = 'Henüz dosya eklenmedi';
        fileListEl.appendChild(li);
        return;
      }
      files.forEach(f=>{
        const li = document.createElement('li');
        li.className = 'file-item';
        li.innerHTML = `
          <span class="file-icon">${fileIconFor(f.type||'')}</span>
          <div class="file-info">
            <div class="file-name"></div>
            <div class="file-sub">${fmtSize(f.size)} · ${fmtDate(f.addedAt)}</div>
          </div>
          <div class="file-actions">
            <button class="icon-btn dl-btn" title="İndir">⭳</button>
            <button class="icon-btn danger rm-btn" title="Sil">✕</button>
          </div>
        `;
        li.querySelector('.file-name').textContent = f.name;
        li.addEventListener('click', ()=>openPreview(f));
        li.querySelector('.dl-btn').addEventListener('click', (e)=>{
          e.stopPropagation();
          downloadFile(f);
        });
        li.querySelector('.rm-btn').addEventListener('click', (e)=>{
          e.stopPropagation();
          if(currentPreviewFile && currentPreviewFile.id === f.id) closePreview();
          DB.deleteFile(f.id).then(()=>renderFileList(projectId));
        });
        fileListEl.appendChild(li);
      });
    });
  }

  function downloadFile(f){
    const url = URL.createObjectURL(f.blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  /* ---------------- file preview panel ---------------- */
  let currentPreviewFile = null;
  let currentPreviewUrl = null;
  let currentHtmlText = null;
  let previewShowingSource = false;
  let previewWidth = 560;
  let previewMaximized = false;
  const previewOverlay = document.getElementById('preview-overlay');
  const previewPanel = document.getElementById('preview-panel');
  const previewResizeHandle = document.getElementById('preview-resize');
  const previewMaximizeBtn = document.getElementById('preview-maximize');
  const previewTitle = document.getElementById('preview-title');
  const previewBody = document.getElementById('preview-body');
  const previewToggleSrc = document.getElementById('preview-toggle-src');

  function getFileCategory(f){
    const type = f.type || '';
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if(type.startsWith('image/')) return 'image';
    if(type === 'application/pdf' || ext === 'pdf') return 'pdf';
    if(type.startsWith('video/')) return 'video';
    if(type.startsWith('audio/')) return 'audio';
    if(type === 'text/html' || ext === 'html' || ext === 'htm') return 'html';
    const textExts = ['txt','md','markdown','json','csv','js','ts','jsx','tsx','css','xml','yml','yaml','log','ini','sh','py','java','c','cpp','rb'];
    if(type.startsWith('text/') || type === 'application/json' || textExts.includes(ext)) return 'text';
    return 'other';
  }

  function openPreview(f){
    if(currentPreviewUrl){ URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl = null; }
    currentPreviewFile = f;
    currentHtmlText = null;
    previewShowingSource = false;
    previewToggleSrc.style.display = 'none';
    previewToggleSrc.title = 'Kaynağı göster';
    previewTitle.textContent = f.name;
    previewBody.innerHTML = '';

    const cat = getFileCategory(f);
    if(cat === 'image'){
      const url = URL.createObjectURL(f.blob);
      currentPreviewUrl = url;
      const img = document.createElement('img');
      img.src = url;
      img.alt = f.name;
      previewBody.appendChild(img);
    } else if(cat === 'pdf'){
      const url = URL.createObjectURL(f.blob);
      currentPreviewUrl = url;
      const iframe = document.createElement('iframe');
      iframe.src = url;
      previewBody.appendChild(iframe);
    } else if(cat === 'video'){
      const url = URL.createObjectURL(f.blob);
      currentPreviewUrl = url;
      const video = document.createElement('video');
      video.src = url;
      video.controls = true;
      previewBody.appendChild(video);
    } else if(cat === 'audio'){
      const url = URL.createObjectURL(f.blob);
      currentPreviewUrl = url;
      const audio = document.createElement('audio');
      audio.src = url;
      audio.controls = true;
      previewBody.appendChild(audio);
    } else if(cat === 'html'){
      previewBody.innerHTML = '<p style="color:var(--text-faint);font-size:12.5px;margin:auto;">Yükleniyor…</p>';
      f.blob.text().then(txt=>{
        if(currentPreviewFile !== f) return;
        currentHtmlText = txt;
        previewToggleSrc.style.display = 'inline-flex';
        buildHtmlPreviewViews();
      });
    } else if(cat === 'text'){
      previewBody.innerHTML = '<p style="color:var(--text-faint);font-size:12.5px;margin:auto;">Yükleniyor…</p>';
      f.blob.text().then(txt=>{
        if(currentPreviewFile !== f) return;
        const pre = document.createElement('pre');
        pre.textContent = txt.length > 200000
          ? txt.slice(0,200000) + '\n\n… (dosya çok uzun, tamamını görmek için indir)'
          : txt;
        previewBody.innerHTML = '';
        previewBody.appendChild(pre);
      });
    } else {
      const fallback = document.createElement('div');
      fallback.className = 'preview-fallback';
      fallback.innerHTML = `
        <div class="pf-icon">${fileIconFor(f.type||'')}</div>
        <p>Bu dosya türü tarayıcıda önizlenemiyor.</p>
        <button class="btn btn-primary btn-sm" id="pf-download">⭳ İndir</button>
      `;
      previewBody.appendChild(fallback);
      fallback.querySelector('#pf-download').addEventListener('click', ()=>downloadFile(f));
    }

    previewOverlay.classList.add('open');
  }

  function buildHtmlPreviewViews(){
    previewBody.innerHTML = '';

    const iframe = document.createElement('iframe');
    iframe.id = 'html-preview-iframe';
    iframe.setAttribute('sandbox', 'allow-scripts allow-popups allow-forms');
    iframe.style.background = '#fff';
    iframe.srcdoc = currentHtmlText;

    const pre = document.createElement('pre');
    pre.id = 'html-preview-source';
    pre.textContent = currentHtmlText.length > 200000
      ? currentHtmlText.slice(0,200000) + '\n\n… (dosya çok uzun, tamamını görmek için indir)'
      : currentHtmlText;
    pre.style.display = 'none';

    previewBody.appendChild(iframe);
    previewBody.appendChild(pre);
    applyHtmlPreviewMode();
  }

  function applyHtmlPreviewMode(){
    const iframe = document.getElementById('html-preview-iframe');
    const pre = document.getElementById('html-preview-source');
    if(!iframe || !pre) return;
    iframe.style.display = previewShowingSource ? 'none' : 'block';
    pre.style.display = previewShowingSource ? 'block' : 'none';
  }

  previewToggleSrc.addEventListener('click', ()=>{
    previewShowingSource = !previewShowingSource;
    previewToggleSrc.title = previewShowingSource ? 'Önizlemeyi göster' : 'Kaynağı göster';
    previewToggleSrc.style.color = previewShowingSource ? 'var(--accent)' : '';
    applyHtmlPreviewMode();
  });

  /* ---------------- preview panel resize / maximize ---------------- */
  previewPanel.style.width = previewWidth + 'px';

  function startResize(e){
    e.preventDefault();
    previewMaximized = false;
    previewMaximizeBtn.style.color = '';
    previewPanel.classList.add('no-transition');
    previewResizeHandle.classList.add('dragging');
    document.body.style.userSelect = 'none';

    function onMove(moveEvt){
      const clientX = moveEvt.touches ? moveEvt.touches[0].clientX : moveEvt.clientX;
      const newWidth = Math.min(Math.max(window.innerWidth - clientX, 340), window.innerWidth - 32);
      previewWidth = newWidth;
      previewPanel.style.width = newWidth + 'px';
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      previewPanel.classList.remove('no-transition');
      previewResizeHandle.classList.remove('dragging');
      document.body.style.userSelect = '';
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('touchend', onUp);
  }
  previewResizeHandle.addEventListener('mousedown', startResize);
  previewResizeHandle.addEventListener('touchstart', startResize, {passive:false});
  previewResizeHandle.addEventListener('dblclick', ()=>{
    previewWidth = 560;
    previewMaximized = false;
    previewMaximizeBtn.style.color = '';
    previewPanel.style.width = previewWidth + 'px';
  });

  previewMaximizeBtn.addEventListener('click', ()=>{
    previewMaximized = !previewMaximized;
    previewMaximizeBtn.title = previewMaximized ? 'Daralt' : 'Genişlet';
    previewMaximizeBtn.style.color = previewMaximized ? 'var(--accent)' : '';
    previewPanel.style.width = previewMaximized ? 'min(1400px, 96vw)' : previewWidth + 'px';
  });

  function closePreview(){
    previewOverlay.classList.remove('open');
    currentPreviewFile = null;
    currentHtmlText = null;
    previewShowingSource = false;
    previewToggleSrc.style.display = 'none';
    if(currentPreviewUrl){ URL.revokeObjectURL(currentPreviewUrl); currentPreviewUrl = null; }
  }

  document.getElementById('preview-close').addEventListener('click', closePreview);
  document.getElementById('preview-download').addEventListener('click', ()=>{
    if(currentPreviewFile) downloadFile(currentPreviewFile);
  });
  previewOverlay.addEventListener('click', (e)=>{
    if(e.target === previewOverlay) closePreview();
  });

  function addFiles(fileListObj, projectId){
    const files = Array.from(fileListObj);
    if(files.length === 0) return;
    Promise.all(files.map(file=>{
      const rec = {
        id: uid(),
        projectId,
        name: file.name,
        type: file.type,
        size: file.size,
        blob: file,
        addedAt: Date.now()
      };
      return DB.putFile(rec);
    })).then(()=>{
      renderFileList(projectId);
      touchProject(projectId);
      showToast(files.length > 1 ? files.length + ' dosya eklendi' : 'Dosya eklendi');
    });
  }

  function touchProject(id){
    const p = projects.find(x=>x.id===id);
    if(!p) return;
    p.updatedAt = Date.now();
    DB.putProject(p);
  }

  /* ---------------- note autosave ---------------- */
  noteTextarea.addEventListener('input', ()=>{
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      const p = projects.find(x=>x.id===currentProjectId);
      if(!p) return;
      p.note = noteTextarea.value;
      p.updatedAt = Date.now();
      DB.putProject(p).then(()=>{
        saveIndicator.classList.add('show');
        setTimeout(()=>saveIndicator.classList.remove('show'), 1200);
      });
    }, 500);
  });

  detailTitle.addEventListener('change', ()=>{
    const p = projects.find(x=>x.id===currentProjectId);
    if(!p) return;
    const val = detailTitle.value.trim();
    if(!val){ detailTitle.value = p.name; return; }
    p.name = val;
    p.updatedAt = Date.now();
    DB.putProject(p);
    renderRail();
  });

  document.getElementById('back-btn').addEventListener('click', closeProject);

  document.getElementById('detail-color-btn').addEventListener('click', (e)=>{
    const p = projects.find(x=>x.id===currentProjectId);
    if(!p) return;
    openColorPicker(p, (newColor)=>{
      p.color = newColor;
      p.updatedAt = Date.now();
      DB.putProject(p);
      detailTagDot.style.setProperty('--tag-color', colorHex(p.color));
      renderRail();
    });
  });

  document.getElementById('detail-delete-btn').addEventListener('click', ()=>{
    const p = projects.find(x=>x.id===currentProjectId);
    if(!p) return;
    openDeleteConfirm(p, closeProject);
  });

  /* ---------------- drag & drop / file input ---------------- */
  dropzone.addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', ()=>{
    addFiles(fileInput.files, currentProjectId);
    fileInput.value = '';
  });
  ['dragenter','dragover'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave','drop'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('dragover');
    });
  });
  dropzone.addEventListener('drop', (e)=>{
    if(e.dataTransfer && e.dataTransfer.files){
      addFiles(e.dataTransfer.files, currentProjectId);
    }
  });

  /* ---------------- modals ---------------- */
  const modalRoot = document.getElementById('modal-root');

  function closeModal(){
    modalRoot.innerHTML = '';
  }

  function openNewProjectModal(){
    let selectedColor = PALETTE[0].id;
    modalRoot.innerHTML = `
      <div class="modal-overlay" id="overlay">
        <div class="modal">
          <h3>Yeni Proje</h3>
          <input type="text" id="np-name" placeholder="Proje adı" autofocus>
          <div class="color-row" id="np-colors"></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="np-cancel">Vazgeç</button>
            <button class="btn btn-primary" id="np-create">Oluştur</button>
          </div>
        </div>
      </div>
    `;

      const sw = document.createElement('div');
      sw.className = 'color-swatch' + (c.id===selectedColor ? ' selected' : '');
      sw.style.background = c.hex;

    nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') create(); });

    function create(){
      const name = nameInput.value.trim() || 'İsimsiz Proje';
      const p = {
        id: uid(),
        name,
        color: selectedColor,
        note: '',

      };
      DB.putProject(p).then(()=>{
        projects.push(p);

        renderHome();

      <div class="modal-overlay" id="overlay">

  function openColorPicker(p, onPick){

      <div class="modal-overlay" id="overlay">
        <div class="modal">
          <h3>Renk Seç</h3>
          <div class="color-row" id="cp-colors"></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="cp-cancel">Vazgeç</button>
            <button class="btn btn-primary" id="cp-save">Uygula</button>
          </div>
        </div>
      </div>
    `;

      sw.className = 'color-swatch' + (c.id===selectedColor ? ' selected' : '');

        [...colorRow.children].forEach(el=>el.classList.remove('selected'));
        sw.classList.add('selected');

  function openDeleteConfirm(p, afterDelete){
    modalRoot.innerHTML = `
      <div class="modal-overlay" id="overlay">
        <div class="modal">
          <h3>“${escapeHtml(p.name)}” silinsin mi?</h3>
          <p>Bu projeye ait tüm notlar ve dosyalar kalıcı olarak silinecek. Bu işlem geri alınamaz.</p>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="dc-cancel">Vazgeç</button>
            <button class="btn btn-primary" id="dc-confirm" style="background:var(--danger);border-color:var(--danger);color:#fff;">Sil</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('overlay').addEventListener('click', (e)=>{
      if(e.target.id === 'overlay') closeModal();
    });
    document.getElementById('dc-cancel').addEventListener('click', closeModal);
    document.getElementById('dc-confirm').addEventListener('click', ()=>{
      Promise.all([DB.deleteProject(p.id), DB.deleteFilesForProject(p.id)]).then(()=>{
        projects = projects.filter(x=>x.id !== p.id);
        closeModal();
        showToast('Proje silindi');
        if(afterDelete) afterDelete();
        else renderHome();
      });
    });
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  /* ---------------- export / import ---------------- */
  function blobToBase64(blob){
    return new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  function base64ToBlob(dataUrl){
    return fetch(dataUrl).then(r=>r.blob());
  }

  document.getElementById('export-btn').addEventListener('click', ()=>{
    Promise.all([DB.allProjects(), DB.allFiles()]).then(async ([allProjects, allFiles])=>{
      const filesOut = [];
      for(const f of allFiles){
        const b64 = await blobToBase64(f.blob);
        filesOut.push({id:f.id, projectId:f.projectId, name:f.name, type:f.type, size:f.size, addedAt:f.addedAt, data:b64});
      }
      const payload = {
        app: 'defter',
        exportedAt: Date.now(),
        projects: allProjects,
        files: filesOut
      };
      const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `defter-yedek-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      showToast('Yedek dosyası indirildi');
    });
  });

  document.getElementById('import-btn').addEventListener('click', ()=>{
    document.getElementById('import-file-input').click();
  });
  document.getElementById('import-file-input').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const payload = JSON.parse(reader.result);
        if(!payload.projects) throw new Error('bad format');
        const idMap = {};
        for(const p of payload.projects){
          const newId = uid();
          idMap[p.id] = newId;
          await DB.putProject({...p, id:newId});
        }
        for(const f of (payload.files||[])){
          const blob = await base64ToBlob(f.data);
          await DB.putFile({
            id: uid(),
            projectId: idMap[f.projectId] || f.projectId,
            name: f.name, type: f.type, size: f.size, addedAt: f.addedAt,
            blob
          });
        }
        await loadAll();
        showToast('İçe aktarma tamamlandı');
      }catch(err){
        showToast('Dosya okunamadı — geçerli bir yedek dosyası mı?');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ---------------- top-level events ---------------- */
  document.getElementById('new-project-btn').addEventListener('click', openNewProjectModal);
  document.getElementById('empty-new-btn').addEventListener('click', openNewProjectModal);
  searchInput.addEventListener('input', ()=>{
    searchTerm = searchInput.value;
    renderHome();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      if(previewOverlay.classList.contains('open')) closePreview();
      else if(modalRoot.innerHTML) closeModal();
      else if(projectView.classList.contains('active')) closeProject();
    }
  });

  /* ---------------- init ---------------- */
  function loadAll(){
    return DB.allProjects().then(list=>{
      projects = list;
      renderHome();
    });
  }

  loadAll().catch(err=>{
    console.error(err);
    showToast('Veritabanı açılamadı. Tarayıcı gizli modda mı?');
  });

})();
</script>
</body>
</html>
